<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MovieHouse — Admin Login</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
         font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
         background: #0e0f13; color: #e8e8ea; }
  .card { width: 360px; background: #15171d; border: 1px solid #23252d; border-radius: 14px;
          padding: 28px; }
  h1 { font-size: 20px; margin: 0 0 4px; }
  .sub { color: #8b8f9c; font-size: 13px; margin-bottom: 20px; }
  label { font-size: 13px; color: #a9adba; display: block; margin: 14px 0 6px; }
  input { width: 100%; padding: 11px; background: #0e0f13; color: #e8e8ea;
          border: 1px solid #2c2f3a; border-radius: 9px; font-size: 14px; }
  button { width: 100%; margin-top: 20px; background: #2a6df4; color: #fff; border: 0;
           padding: 12px; border-radius: 9px; font-size: 15px; cursor: pointer; }
  button:hover { filter: brightness(1.08); }
  .error { background: #3a1d22; border: 1px solid #6b2b34; color: #f3a9b2;
           padding: 9px 12px; border-radius: 8px; font-size: 13px; margin-bottom: 4px; }
  .foot { color: #6b6f7c; font-size: 12px; margin-top: 16px; text-align: center; }
</style>
</head>
<body>
  <form class="card" method="post" action="/login">
    <h1>🎬 MovieHouse</h1>
    <div class="sub">Admin sign in</div>
    {{error_block}}
    <label>Email</label>
    <input type="email" name="email" autocomplete="username" required autofocus>
    <label>Password</label>
    <input type="password" name="password" autocomplete="current-password" required>
    <button type="submit">Sign in</button>
    <div class="foot">Authenticated via your SSO server</div>
  </form>
</body>
</html>
